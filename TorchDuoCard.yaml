type: custom:bubble-card
card_type: pop-up
hash: "#duo"
margin_top_mobile: auto
margin_top_desktop: auto
show_header: false
close_by_clicking_outside: false
backdrop_blur: "5"
bg_blur: "100"
bg_opacity: "50"
button_type: name
styles: |
  #root {
    border: 1px solid rgba(var(--rgb-primary-text-color),0.1);
    background: rgba(255, 255, 255, 0.1);
    }
sub_button:
  main: []
  bottom: []
cards:
  - type: custom:mushroom-chips-card
    chips:
      - type: template
        content: Торшер Дуо
        double_tap_action:
          action: none
        tap_action:
          action: none
        hold_action:
          action: none
        icon: hue:bollard
      - type: spacer
      - type: back
        card_mod:
          style:
            .: |
              {% set hover = 'true' %}
              {% set stating = 'false' %}
              {% include 'chip_settings_style.jinja' %}
    card_mod:
      style:
        mushroom-back-chip:nth-child(3)$: |
          ha-state-icon {
            --card-mod-icon: mdi:close;
          }
        .: |
          {% include 'pop_up_title.jinja' %}
    grid_options:
      columns: 12
      rows: auto
  - type: custom:mushroom-chips-card
    chips:
      - type: template
        entity: light.torsher_2
        tap_action:
          action: toggle
        hold_action:
          action: none
        double_tap_action:
          action: none
        icon: mdi:power
        icon_color: |-
          {%if is_state('light.torsher_2','on')%}
          {{state_attr(config.entity,'rgb_color')}} {%else %} '1' {% endif %}
        card_mod:
          style:
            .: |
              {% set scale = '1' %}
              {% set hover = 'true' %}
              {% set stating = 'true' %}
              {% set state_on = 'on' %}
              {% set color = 'rgba(120,120,120,0.2)' %}
              {% set hover_color_off = 'rgba(120,120,120,0.3) !important' %}
              {% include 'chip_settings_style.jinja' %}
    alignment: center
    card_mod:
      style:
        .: |
          ha-card {
             --chip-background: none !important;
             --chip-border-radius: 1000px;
             zoom: 6;
             #--chip-height: 200px;
             --chip-spacing: {{chip_spacing|default(0)}}px;
             margin: 2px;
             }
  - type: custom:horizontal-stack-in-card
    cards:
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: light.torsher_duo_verkh
        grid_options:
          columns: 12
          rows: auto
        color: >-
          {% if is_state(entity, 'on')%} {{state_attr(config.entity,
          'rgb_color')}}

          {% else %} disabled 

          {% endif%}
        tap_action:
          action: toggle
        icon: mdi:arrow-up-drop-circle
        vertical: true
        icon_tap_action:
          action: none
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none;
            }
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: light.torsher_duo_niz
        grid_options:
          columns: 12
          rows: auto
        color: >-
          {% if is_state(entity, 'on')%} {{state_attr(config.entity,
          'rgb_color')}}

          {% else %} disabled 

          {% endif%}
        tap_action:
          action: toggle
        icon: mdi:arrow-down-drop-circle
        vertical: true
        icon_tap_action:
          action: none
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none;
            }
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: light.embi_lampa
        grid_options:
          columns: 12
          rows: auto
        color: white
        tap_action:
          action: navigate
          navigation_path: "#duo_settings"
        icon: mdi:dots-horizontal
        vertical: true
        icon_tap_action:
          action: none
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none;
            }
    card_mod:
      style: |
        ha-card {
         background: none !important;
        }
popup_mode: default
card_layout: large
slide_to_close_distance: "500"
